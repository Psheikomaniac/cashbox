services:
    # Repository configuration has been moved to attributes in the repository classes.
    # Each repository class now uses:
    # - #[AsAlias(RepositoryInterface::class)] to bind the interface to the implementation
    # - #[AutoconfigureTag('app.repository')] to tag the service
    #
    # This allows for autowiring and reduces manual configuration.
    #
    # Example:
    # #[AsAlias(PenaltyRepositoryInterface::class)]
    # #[AutoconfigureTag('app.repository')]
    # class DoctrinePenaltyRepository implements PenaltyRepositoryInterface
    # {
    #     public function __construct(
    #         private readonly EntityManagerInterface $entityManager
    #     ) {}
    #     // ...
    # }
