# Rate limiter configuration for the Cashbox application
framework:
    rate_limiter:
        # Login rate limiter to prevent brute force attacks
        login:
            # Allow 5 login attempts per minute
            policy: 'fixed_window'
            limit: 5
            interval: '1 minute'

        # API rate limiter to prevent abuse
        api:
            # Allow 60 API requests per minute
            policy: 'sliding_window'
            limit: 60
            interval: '1 minute'

        # More restrictive rate limiter for sensitive operations
        sensitive_operations:
            # Allow 10 sensitive operations per hour
            policy: 'token_bucket'
            limit: 10
            rate: { interval: '1 hour', amount: 10 }
